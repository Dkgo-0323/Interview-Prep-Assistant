# Include inside nginx http {}; replace example.invalid and certificate paths.
# No access log: OAuth callback query contains short-lived credentials.
server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/interview-prep/tls/fullchain.pem;
    ssl_certificate_key /etc/interview-prep/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # nginx error logs may contain a request URI, including OAuth query strings.
    # Keep them disabled here pending a reviewed redacting logging pipeline.
    error_log /dev/null crit;
    client_max_body_size 11m;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
